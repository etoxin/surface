[tools]
deno = "latest"

[tasks.deps]
description = "Cache dependencies from deno.json and deno.lock"
run = "deno cache src/cli.ts test/surface_test.ts"

[tasks.format]
description = "Format source, tests, and documentation"
run = "deno fmt"

[tasks."format-check"]
description = "Check repository formatting"
run = "deno fmt --check"

[tasks.lint]
description = "Lint source and test files"
run = "deno lint"

[tasks.typecheck]
description = "Type-check the complete TypeScript graph"
depends = ["deps"]
run = "deno task typecheck"

[tasks.test]
description = "Run the test suite"
depends = ["deps"]
run = "deno task test"

[tasks.verify]
description = "Verify the entire repository"
depends = ["format-check", "lint", "typecheck", "test"]

[tasks.check]
description = "Compatibility alias for verify"
depends = ["verify"]

[tasks.surf]
description = "Run the Surface CLI"
depends = ["deps"]
raw_args = true
run = "deno task surf"

[tasks."todo-list"]
description = "Serve the Todo List example on port 8003"
depends = ["deps"]
run = "deno task todo-list"

[tasks."online-checkout"]
description = "Run the Online Checkout example on port 8006"
depends = ["deps"]
run = "deno task online-checkout"

[tasks."multi-tenant-project-tracker"]
description = "Run the Multi-tenant Project Tracker example on port 8007"
depends = ["deps"]
run = "deno task multi-tenant-project-tracker"
