[tools]
deno = "latest"

[tasks.deps]
description = "Cache dependencies from deno.json and deno.lock"
run = "deno cache src/cli.ts test/surface_test.ts"

[tasks.format]
description = "Format source and test files"
run = "deno fmt"

[tasks."format-check"]
description = "Check source and test formatting"
run = "deno fmt --check"

[tasks.lint]
description = "Lint source and test files"
run = "deno lint"

[tasks.typecheck]
description = "Type-check the complete TypeScript graph"
depends = ["deps"]
run = "deno task typecheck"

[tasks.test]
description = "Run the test suite"
depends = ["deps"]
run = "deno test --allow-read --allow-write --allow-run"

[tasks.verify]
description = "Verify the entire repository"
depends = ["format-check", "lint", "typecheck", "test"]

[tasks.check]
description = "Compatibility alias for verify"
depends = ["verify"]

[tasks.surf]
description = "Run the Surface CLI"
depends = ["deps"]
raw_args = true
run = "deno run --allow-read --allow-write src/cli.ts"

[tasks."contact-viewer"]
description = "Run the rung-3 Contact Viewer example"
depends = ["deps"]
run = "deno task contact-viewer"

[tasks."click-counter"]
description = "Run the rung-4 Click Counter example"
depends = ["deps"]
run = "deno task click-counter"
