<!doctype html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#006853">
    <title>Report a street problem – Northbridge Council</title>
    <link rel="stylesheet" href="/assets/govuk-frontend.min.css">
  </head>
  <body class="govuk-template__body">
    <a href="#main-content" class="govuk-skip-link">Skip to main content</a>
    <header class="govuk-generic-header" role="banner">
      <div class="govuk-generic-header__container govuk-width-container">
        <div class="govuk-generic-header__logo">
          <a href="/" class="govuk-generic-header__homepage-link">
            <svg width="28" height="30" viewBox="0 0 28 30" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <circle cx="13.5549" cy="4.21349" r="4.21349"></circle><circle cx="13.5549" cy="25.7865" r="4.21349"></circle><circle cx="22.8963" cy="9.6068" r="4.21349"></circle><circle cx="4.2135" cy="20.3932" r="4.21349"></circle><circle cx="22.8963" cy="20.3932" r="4.21349"></circle><circle cx="4.21351" cy="9.60674" r="4.21349"></circle>
            </svg>
            Northbridge Council
          </a>
        </div>
      </div>
    </header>
    <main class="govuk-main-wrapper" id="main-content" tabindex="-1">
      <div class="govuk-width-container">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds" id="app"></div>
        </div>
      </div>
    </main>
    <footer class="govuk-footer">
      <div class="govuk-width-container">
        <div class="govuk-footer__meta">
          <div class="govuk-footer__meta-item">Northbridge Council</div>
        </div>
      </div>
    </footer>
    <script>
      const baseTitle = "Report a street problem – Northbridge Council";
      const app = document.getElementById("app");
      const report = { problemType: "", location: "", details: "", reporterEmail: "" };
      const labels = { pothole: "Pothole", brokenStreetlight: "Broken streetlight", damagedRoadSign: "Damaged road sign" };
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[character]);
      const errorMessage = (id, message) => message ? `<p id="${id}-error" class="govuk-error-message"><span class="govuk-visually-hidden">Error:</span> ${message}</p>` : "";
      const describedBy = (id, hint, errors) => `${hint ? `${id}-hint ` : ""}${errors[id] ? `${id}-error` : ""}`.trim();

      function renderForm(errors = {}) {
        document.title = Object.keys(errors).length ? `Error: ${baseTitle}` : baseTitle;
        const summary = Object.entries(errors).length ? `<div class="govuk-error-summary" data-module="govuk-error-summary" tabindex="-1"><div role="alert"><h2 class="govuk-error-summary__title">There is a problem</h2><div class="govuk-error-summary__body"><ul class="govuk-list govuk-error-summary__list">${Object.entries(errors).map(([id, message]) => `<li><a href="#${id}">${message}</a></li>`).join("")}</ul></div></div></div>` : "";
        app.innerHTML = `${summary}<h1 class="govuk-heading-xl">Report a street problem</h1><form id="report-form" novalidate>
          <div id="problemType-group" class="govuk-form-group${errors.problemType ? " govuk-form-group--error" : ""}"><fieldset class="govuk-fieldset" aria-describedby="${describedBy("problemType", true, errors)}"><legend class="govuk-fieldset__legend govuk-fieldset__legend--m"><span class="govuk-fieldset__heading">What is the problem?</span></legend><div id="problemType-hint" class="govuk-hint">Select one option.</div>${errorMessage("problemType", errors.problemType)}<div class="govuk-radios" data-module="govuk-radios">${Object.entries(labels).map(([value, label]) => `<div class="govuk-radios__item"><input class="govuk-radios__input" id="problemType-${value}" name="problemType" type="radio" value="${value}"${report.problemType === value ? " checked" : ""}><label class="govuk-label govuk-radios__label" for="problemType-${value}">${label}</label></div>`).join("")}</div></fieldset></div>
          <div id="location-group" class="govuk-form-group${errors.location ? " govuk-form-group--error" : ""}"><label class="govuk-label govuk-label--m" for="location">Where is the problem?</label><div id="location-hint" class="govuk-hint">For example, outside 14 Market Street.</div>${errorMessage("location", errors.location)}<input class="govuk-input${errors.location ? " govuk-input--error" : ""}" id="location" name="location" type="text" aria-describedby="${describedBy("location", true, errors)}" value="${escapeHtml(report.location)}"></div>
          <div class="govuk-form-group"><label class="govuk-label govuk-label--m" for="details">Tell us more (optional)</label><div id="details-hint" class="govuk-hint">Do not include personal or financial information.</div><textarea class="govuk-textarea" id="details" name="details" rows="5" aria-describedby="details-hint">${escapeHtml(report.details)}</textarea></div>
          <div id="reporterEmail-group" class="govuk-form-group${errors.reporterEmail ? " govuk-form-group--error" : ""}"><label class="govuk-label govuk-label--m" for="reporterEmail">Email address</label><div id="reporterEmail-hint" class="govuk-hint">We will send your reference number here.</div>${errorMessage("reporterEmail", errors.reporterEmail)}<input class="govuk-input govuk-input--width-20${errors.reporterEmail ? " govuk-input--error" : ""}" id="reporterEmail" name="reporterEmail" type="email" autocomplete="email" spellcheck="false" aria-describedby="${describedBy("reporterEmail", true, errors)}" value="${escapeHtml(report.reporterEmail)}"></div>
          <button class="govuk-button" data-module="govuk-button" type="submit">Continue</button>
        </form>`;
        document.getElementById("report-form").addEventListener("submit", continueToReview);
        const errorSummary = document.querySelector(".govuk-error-summary");
        if (errorSummary) errorSummary.focus();
      }

      function continueToReview(event) {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        report.problemType = String(data.get("problemType") || "");
        report.location = String(data.get("location") || "").trim();
        report.details = String(data.get("details") || "").trim();
        report.reporterEmail = String(data.get("reporterEmail") || "").trim().toLowerCase();
        const errors = {};
        if (!report.problemType) errors.problemType = "Select the type of street problem.";
        if (!report.location) errors.location = "Enter where the problem is.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(report.reporterEmail)) errors.reporterEmail = "Enter a valid email address.";
        Object.keys(errors).length ? renderForm(errors) : renderReview();
      }

      function renderReview() {
        document.title = `Check your answers – ${baseTitle}`;
        const rows = [["Problem", labels[report.problemType], "problemType"], ["Location", report.location, "location"], ["Details", report.details || "Not provided", "details"], ["Email address", report.reporterEmail, "reporterEmail"]];
        app.innerHTML = `<a href="#" class="govuk-back-link" data-action="back">Back</a><h1 class="govuk-heading-xl">Check your answers before sending your report</h1><dl class="govuk-summary-list">${rows.map(([key, value, field]) => `<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">${key}</dt><dd class="govuk-summary-list__value">${escapeHtml(value)}</dd><dd class="govuk-summary-list__actions"><a class="govuk-link" href="#${field}" data-action="change">Change<span class="govuk-visually-hidden"> ${key.toLowerCase()}</span></a></dd></div>`).join("")}</dl><button class="govuk-button" data-module="govuk-button" data-action="send" type="button">Send report</button>`;
        app.querySelectorAll('[data-action="back"], [data-action="change"]').forEach((link) => link.addEventListener("click", (event) => { event.preventDefault(); renderForm(); }));
        app.querySelector('[data-action="send"]').addEventListener("click", renderConfirmation);
        document.getElementById("main-content").focus();
      }

      function renderConfirmation() {
        document.title = `Report submitted – ${baseTitle}`;
        app.innerHTML = `<div class="govuk-panel govuk-panel--confirmation"><h1 class="govuk-panel__title">Report submitted</h1><div class="govuk-panel__body">Your reference number<br><strong>SR-2026-001</strong></div></div><p class="govuk-body">We have sent a confirmation to ${escapeHtml(report.reporterEmail)}.</p>`;
        document.getElementById("main-content").focus();
      }

      renderForm();
    </script>
  </body>
</html>
