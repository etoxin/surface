<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create your account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
      body { background: linear-gradient(145deg, #f7f8ff, #eef7f4); }
      main { max-width: 36rem; padding-top: 8vh; }
      article { box-shadow: 0 1rem 3rem rgb(35 45 70 / 10%); }
      .error { color: #b42318; min-height: 1.4rem; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main class="container">
      <article id="panel">
        <header><h1>Create your account</h1><p>One account, four quick fields.</p></header>
        <form id="signup" novalidate>
          <label>Email<input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" required></label>
          <small class="error" id="email-error"></small>
          <label>Password<input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error" required></label>
          <small class="error" id="password-error"></small>
          <label>Confirm password<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" aria-describedby="confirmPassword-error" required></label>
          <small class="error" id="confirmPassword-error"></small>
          <label><input id="acceptedTerms" name="acceptedTerms" type="checkbox" aria-describedby="acceptedTerms-error"> I accept the terms</label>
          <small class="error" id="acceptedTerms-error"></small>
          <button id="submit" type="submit">Create account</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </article>
    </main>
    <script>
      const form = document.querySelector("#signup");
      const status = document.querySelector("#status");
      const fields = ["email", "password", "confirmPassword", "acceptedTerms"];
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        fields.forEach((field) => document.querySelector(`#${field}-error`).textContent = "");
        const controls = [...form.elements];
        controls.forEach((control) => control.disabled = true);
        status.textContent = "Creating account";
        const email = form.email.value.trim().toLowerCase();
        const acceptedTerms = form.acceptedTerms.checked;
        const response = await fetch("/register", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email, password: form.password.value, confirmPassword: form.confirmPassword.value, acceptedTerms })
        });
        const result = await response.json();
        if (result.status === "success") {
          document.querySelector("#panel").innerHTML = '<h1>Account created</h1><p role="status">Your account is ready.</p>';
          return;
        }
        form.email.value = email;
        form.password.value = "";
        form.confirmPassword.value = "";
        form.acceptedTerms.checked = acceptedTerms;
        result.errors.forEach((error) => document.querySelector(`#${error.field}-error`).textContent = error.message);
        controls.forEach((control) => control.disabled = false);
        document.querySelector(`#${result.errors[0].field}`).focus();
        status.textContent = "Signup failed";
      });
    </script>
  </body>
</html>
