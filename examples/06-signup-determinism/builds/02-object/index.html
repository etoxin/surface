<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Surface</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
      main { min-height: 100vh; display: grid; align-items: center; }
      .shell { display: grid; grid-template-columns: 2fr 3fr; border: 1px solid var(--pico-muted-border-color); border-radius: 1rem; overflow: hidden; }
      .intro { padding: 3rem; background: #172554; color: white; }
      .form-panel { padding: 3rem; }
      .error { color: #b42318; display: block; min-height: 1.25rem; }
      @media (max-width: 700px) { .shell { grid-template-columns: 1fr; } .intro { padding: 1.5rem; } }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="shell" id="result">
        <div class="intro"><h1>Create an account</h1><p>Accessible, private, and quick to complete.</p></div>
        <div class="form-panel">
          <form id="signup-form" novalidate>
            <label for="email">Email</label><input id="email" type="email" autocomplete="email" aria-describedby="email-error"><small id="email-error" class="error"></small>
            <label for="password">Password</label><input id="password" type="password" autocomplete="new-password" aria-describedby="password-error"><small id="password-error" class="error"></small>
            <label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" aria-describedby="confirmPassword-error"><small id="confirmPassword-error" class="error"></small>
            <label><input id="acceptedTerms" type="checkbox" aria-describedby="acceptedTerms-error"> I accept the terms</label><small id="acceptedTerms-error" class="error"></small>
            <button type="submit">Create account</button>
          </form>
          <div id="announcement" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <script>
      const form = document.getElementById("signup-form");
      const announcement = document.getElementById("announcement");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const confirmationInput = document.getElementById("confirmPassword");
      const termsInput = document.getElementById("acceptedTerms");
      const names = ["email", "password", "confirmPassword", "acceptedTerms"];
      form.onsubmit = async (event) => {
        event.preventDefault();
        names.forEach((name) => document.getElementById(`${name}-error`).textContent = "");
        const preserved = { email: emailInput.value.trim().toLowerCase(), acceptedTerms: termsInput.checked };
        [...form.elements].forEach((element) => element.disabled = true);
        announcement.textContent = "Creating account";
        const response = await fetch("/register", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: preserved.email, password: passwordInput.value, confirmPassword: confirmationInput.value, acceptedTerms: preserved.acceptedTerms }) });
        const output = await response.json();
        if (output.status === "success") {
          document.getElementById("result").innerHTML = '<article><h1>Account created</h1><p role="status">Your account is ready.</p></article>';
        } else {
          emailInput.value = preserved.email; passwordInput.value = ""; confirmationInput.value = ""; termsInput.checked = preserved.acceptedTerms;
          output.errors.forEach(({ field, message }) => document.getElementById(`${field}-error`).textContent = message);
          [...form.elements].forEach((element) => element.disabled = false);
          document.getElementById(output.errors[0].field).focus();
          announcement.textContent = "Signup failed";
        }
      };
    </script>
  </body>
</html>
