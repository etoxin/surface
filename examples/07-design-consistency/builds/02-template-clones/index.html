<!doctype html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#006853">
    <title>Report a street problem – Northbridge Council</title>
    <link rel="stylesheet" href="/assets/govuk-frontend.min.css">
  </head>
  <body class="govuk-template__body">
    <a href="#main-content" class="govuk-skip-link">Skip to main content</a>
    <header class="govuk-generic-header" role="banner">
      <div class="govuk-generic-header__container govuk-width-container">
        <div class="govuk-generic-header__logo">
          <a href="/" class="govuk-generic-header__homepage-link">
            <svg width="28" height="30" viewBox="0 0 28 30" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <circle cx="13.5549" cy="4.21349" r="4.21349"></circle><circle cx="13.5549" cy="25.7865" r="4.21349"></circle><circle cx="22.8963" cy="9.6068" r="4.21349"></circle><circle cx="4.2135" cy="20.3932" r="4.21349"></circle><circle cx="22.8963" cy="20.3932" r="4.21349"></circle><circle cx="4.21351" cy="9.60674" r="4.21349"></circle>
            </svg>
            Northbridge Council
          </a>
        </div>
      </div>
    </header>
    <main class="govuk-main-wrapper" id="main-content" tabindex="-1">
      <div class="govuk-width-container">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds" id="app"></div>
        </div>
      </div>
    </main>
    <footer class="govuk-footer">
      <div class="govuk-width-container">
        <div class="govuk-footer__meta">
          <div class="govuk-footer__meta-item">Northbridge Council</div>
        </div>
      </div>
    </footer>

    <template id="form-view">
      <h1 class="govuk-heading-xl">Report a street problem</h1>
      <form id="report-form" novalidate>
        <div id="problemType-group" class="govuk-form-group">
          <fieldset class="govuk-fieldset" aria-describedby="problemType-hint">
            <legend class="govuk-fieldset__legend govuk-fieldset__legend--m"><span class="govuk-fieldset__heading">What is the problem?</span></legend>
            <div id="problemType-hint" class="govuk-hint">Select one option.</div>
            <div class="govuk-radios" data-module="govuk-radios">
              <div class="govuk-radios__item"><input class="govuk-radios__input" id="problemType-pothole" name="problemType" type="radio" value="pothole"><label class="govuk-label govuk-radios__label" for="problemType-pothole">Pothole</label></div>
              <div class="govuk-radios__item"><input class="govuk-radios__input" id="problemType-brokenStreetlight" name="problemType" type="radio" value="brokenStreetlight"><label class="govuk-label govuk-radios__label" for="problemType-brokenStreetlight">Broken streetlight</label></div>
              <div class="govuk-radios__item"><input class="govuk-radios__input" id="problemType-damagedRoadSign" name="problemType" type="radio" value="damagedRoadSign"><label class="govuk-label govuk-radios__label" for="problemType-damagedRoadSign">Damaged road sign</label></div>
            </div>
          </fieldset>
        </div>
        <div id="location-group" class="govuk-form-group">
          <label class="govuk-label govuk-label--m" for="location">Where is the problem?</label>
          <div id="location-hint" class="govuk-hint">For example, outside 14 Market Street.</div>
          <input class="govuk-input" id="location" name="location" type="text" aria-describedby="location-hint">
        </div>
        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--m" for="details">Tell us more (optional)</label>
          <div id="details-hint" class="govuk-hint">Do not include personal or financial information.</div>
          <textarea class="govuk-textarea" id="details" name="details" rows="5" aria-describedby="details-hint"></textarea>
        </div>
        <div id="reporterEmail-group" class="govuk-form-group">
          <label class="govuk-label govuk-label--m" for="reporterEmail">Email address</label>
          <div id="reporterEmail-hint" class="govuk-hint">We will send your reference number here.</div>
          <input class="govuk-input govuk-input--width-20" id="reporterEmail" name="reporterEmail" type="email" autocomplete="email" spellcheck="false" aria-describedby="reporterEmail-hint">
        </div>
        <button class="govuk-button" data-module="govuk-button" type="submit">Continue</button>
      </form>
    </template>

    <template id="review-view">
      <a href="#" class="govuk-back-link" data-action="back">Back</a>
      <h1 class="govuk-heading-xl">Check your answers before sending your report</h1>
      <dl class="govuk-summary-list">
        <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Problem</dt><dd class="govuk-summary-list__value" data-value="problemType"></dd><dd class="govuk-summary-list__actions"><a class="govuk-link" href="#problemType" data-action="change">Change<span class="govuk-visually-hidden"> problem</span></a></dd></div>
        <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Location</dt><dd class="govuk-summary-list__value" data-value="location"></dd><dd class="govuk-summary-list__actions"><a class="govuk-link" href="#location" data-action="change">Change<span class="govuk-visually-hidden"> location</span></a></dd></div>
        <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Details</dt><dd class="govuk-summary-list__value" data-value="details"></dd><dd class="govuk-summary-list__actions"><a class="govuk-link" href="#details" data-action="change">Change<span class="govuk-visually-hidden"> details</span></a></dd></div>
        <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Email address</dt><dd class="govuk-summary-list__value" data-value="reporterEmail"></dd><dd class="govuk-summary-list__actions"><a class="govuk-link" href="#reporterEmail" data-action="change">Change<span class="govuk-visually-hidden"> email address</span></a></dd></div>
      </dl>
      <button class="govuk-button" data-module="govuk-button" data-action="send" type="button">Send report</button>
    </template>

    <template id="confirmation-view">
      <div class="govuk-panel govuk-panel--confirmation"><h1 class="govuk-panel__title">Report submitted</h1><div class="govuk-panel__body">Your reference number<br><strong>SR-2026-001</strong></div></div>
      <p class="govuk-body">We have sent a confirmation to <span data-value="reporterEmail"></span>.</p>
    </template>

    <script>
      const baseTitle = "Report a street problem – Northbridge Council";
      const app = document.getElementById("app");
      const state = { problemType: "", location: "", details: "", reporterEmail: "" };
      const problemLabels = { pothole: "Pothole", brokenStreetlight: "Broken streetlight", damagedRoadSign: "Damaged road sign" };

      function mount(templateId) {
        const template = document.getElementById(templateId);
        app.replaceChildren(template.content.cloneNode(true));
      }

      function showForm(errors = []) {
        document.title = errors.length ? `Error: ${baseTitle}` : baseTitle;
        mount("form-view");
        if (state.problemType) document.querySelector(`[name="problemType"][value="${state.problemType}"]`).checked = true;
        document.getElementById("location").value = state.location;
        document.getElementById("details").value = state.details;
        document.getElementById("reporterEmail").value = state.reporterEmail;
        if (errors.length) addErrors(errors);
        document.getElementById("report-form").addEventListener("submit", validateForm);
      }

      function addErrors(errors) {
        const summary = document.createElement("div");
        summary.className = "govuk-error-summary";
        summary.dataset.module = "govuk-error-summary";
        summary.tabIndex = -1;
        summary.innerHTML = `<div role="alert"><h2 class="govuk-error-summary__title">There is a problem</h2><div class="govuk-error-summary__body"><ul class="govuk-list govuk-error-summary__list">${errors.map(({ id, message }) => `<li><a href="#${id}">${message}</a></li>`).join("")}</ul></div></div>`;
        app.prepend(summary);
        for (const { id, message } of errors) {
          const group = document.getElementById(`${id}-group`);
          group.classList.add("govuk-form-group--error");
          const error = document.createElement("p");
          error.id = `${id}-error`;
          error.className = "govuk-error-message";
          error.innerHTML = `<span class="govuk-visually-hidden">Error:</span> ${message}`;
          document.getElementById(`${id}-hint`).after(error);
          const control = id === "problemType" ? group.querySelector("fieldset") : document.getElementById(id);
          control.setAttribute("aria-describedby", `${id}-hint ${id}-error`);
          if (id !== "problemType") control.classList.add("govuk-input--error");
        }
        summary.focus();
      }

      function validateForm(event) {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        Object.assign(state, {
          problemType: String(data.get("problemType") || ""),
          location: String(data.get("location") || "").trim(),
          details: String(data.get("details") || "").trim(),
          reporterEmail: String(data.get("reporterEmail") || "").trim().toLowerCase()
        });
        const errors = [];
        if (!state.problemType) errors.push({ id: "problemType", message: "Select the type of street problem." });
        if (!state.location) errors.push({ id: "location", message: "Enter where the problem is." });
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.reporterEmail)) errors.push({ id: "reporterEmail", message: "Enter a valid email address." });
        errors.length ? showForm(errors) : showReview();
      }

      function showReview() {
        document.title = `Check your answers – ${baseTitle}`;
        mount("review-view");
        document.querySelector('[data-value="problemType"]').textContent = problemLabels[state.problemType];
        document.querySelector('[data-value="location"]').textContent = state.location;
        document.querySelector('[data-value="details"]').textContent = state.details || "Not provided";
        document.querySelector('[data-value="reporterEmail"]').textContent = state.reporterEmail;
        document.querySelectorAll('[data-action="back"], [data-action="change"]').forEach((link) => link.addEventListener("click", (event) => { event.preventDefault(); showForm(); }));
        document.querySelector('[data-action="send"]').addEventListener("click", showConfirmation);
        document.getElementById("main-content").focus();
      }

      function showConfirmation() {
        document.title = `Report submitted – ${baseTitle}`;
        mount("confirmation-view");
        document.querySelector('[data-value="reporterEmail"]').textContent = state.reporterEmail;
        document.getElementById("main-content").focus();
      }

      showForm();
    </script>
  </body>
</html>
