<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List</title>
    <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #f4f6f9;
      color: #18212f;
    }

    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-width: 20rem;
      min-height: 100vh;
    }
    button,
    input {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    .shell {
      width: min(72rem, calc(100% - 2rem));
      margin: auto;
      padding: 3rem 0 5rem;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .eyebrow {
      margin: 0 0 .6rem;
      color: #6c5ce7;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1;
      letter-spacing: -.06em;
    }
    .summary {
      margin: 0 0 .35rem;
      color: #667085;
      font-size: .95rem;
    }
    .composer {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      padding: .75rem;
      border: 1px solid #dfe3ea;
      border-radius: 1rem;
      background: white;
      box-shadow: 0 1rem 3rem rgb(23 32 51 / 7%);
    }
    .composer label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    .composer input {
      min-width: 0;
      flex: 1 1 10rem;
      padding: .85rem 1rem;
      border: 0;
      outline: 0;
      color: inherit;
    }
    .composer input:focus-visible {
      border-radius: .6rem;
      box-shadow: 0 0 0 3px #ded9ff;
    }
    .primary {
      padding: .8rem 1.15rem;
      border: 0;
      border-radius: .7rem;
      background: #6254d9;
      color: white;
      font-weight: 750;
    }
    .error {
      margin: .8rem 0 0;
      padding: .8rem 1rem;
      border-radius: .7rem;
      background: #fff0f0;
      color: #a12626;
      font-weight: 650;
    }
    .error:empty {
      display: none;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }
    .column {
      min-width: 0;
      padding: 1rem;
      border: 1px solid #e1e5ec;
      border-radius: 1rem;
      background: #e9ecf2;
    }
    .column-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 1rem;
      padding: 0 .25rem;
    }
    h2 {
      margin: 0;
      font-size: .9rem;
    }
    .count {
      display: grid;
      min-width: 1.65rem;
      height: 1.65rem;
      place-items: center;
      border-radius: 999px;
      background: white;
      color: #667085;
      font-size: .75rem;
      font-weight: 800;
    }
    .tasks {
      display: grid;
      gap: .65rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .task {
      padding: 1rem;
      border: 1px solid #e4e7ec;
      border-radius: .8rem;
      background: white;
      box-shadow: 0 .35rem 1rem rgb(23 32 51 / 5%);
    }
    .task-text {
      overflow-wrap: anywhere;
      margin: 0;
      line-height: 1.45;
    }
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin: .65rem 0 0;
      padding: 0;
      list-style: none;
      color: #667085;
      font-size: .75rem;
    }
    .task-meta li {
      padding: .25rem .45rem;
      border-radius: .35rem;
      background: #f1f3f7;
    }
    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: .9rem;
    }
    .task-actions button {
      padding: .45rem .65rem;
      border: 1px solid #d8dce5;
      border-radius: .5rem;
      background: #f8f9fb;
      color: #475467;
      font-size: .75rem;
      font-weight: 700;
    }
    .empty {
      padding: 1.25rem .75rem;
      color: #7b8495;
      text-align: center;
      font-size: .85rem;
    }

    @media (max-width: 52rem) {
      .board {
        grid-template-columns: 1fr;
      }
      header {
        align-items: start;
        flex-direction: column;
      }
    }

    @media (max-width: 32rem) {
      .shell {
        padding-top: 2rem;
      }
      .composer {
        align-items: stretch;
        flex-direction: column;
      }
    }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Personal workspace</p>
          <h1>Tasks</h1>
        </div>
        <p class="summary" id="summary">0 tasks in total</p>
      </header>

      <form class="composer" id="composer">
        <label for="task-text">New task</label>
        <input id="task-text" name="text" placeholder="What needs doing?"
          autocomplete="off">
        <label for="due-date">Due date</label>
        <input id="due-date" name="dueDate" type="date" aria-label="Due date">
        <label for="priority">Priority</label>
        <input id="priority" name="priority" type="number" placeholder="Priority"
          aria-label="Priority">
        <label for="tags">Tags</label>
        <input id="tags" name="tags" placeholder="Tags, comma separated"
          aria-label="Tags">
        <button class="primary" type="submit">Add task</button>
      </form>
      <p class="error" id="error" role="alert"></p>

      <div class="board">
        <section class="column" aria-labelledby="open-heading">
          <div class="column-heading">
            <h2 id="open-heading">Open</h2>
            <span class="count" id="open-count" aria-label="0 open">0</span>
          </div>
          <ul class="tasks" id="open-tasks"></ul>
        </section>

        <section class="column" aria-labelledby="completed-heading">
          <div class="column-heading">
            <h2 id="completed-heading">Completed</h2>
            <span class="count" id="completed-count" aria-label="0 completed">0</span>
          </div>
          <ul class="tasks" id="completed-tasks"></ul>
        </section>

        <section class="column" aria-labelledby="archived-heading">
          <div class="column-heading">
            <h2 id="archived-heading">Archived</h2>
            <span class="count" id="archived-count" aria-label="0 archived">0</span>
          </div>
          <ul class="tasks" id="archived-tasks"></ul>
        </section>
      </div>
    </main>

    <script>
    const statuses = ["open", "completed", "archived"];
    let todos = [];

    const createTodo = ({ text, dueDate, priority, tags }) => {
      const value = text.trim();
      return value === "" ? null : {
        id: crypto.randomUUID(),
        text: value,
        status: "open",
        ...(dueDate === "" ? {} : { dueDate }),
        priority: priority === "" ? 1 : Number(priority),
        ...(tags.length === 0 ? {} : { tags }),
      };
    };

    const completeTodo = (todo) =>
      todo.status === "open" ? { ...todo, status: "completed" } : todo;
    const reopenTodo = (todo) =>
      ["completed", "archived"].includes(todo.status) ? { ...todo, status: "open" } : todo;
    const archiveTodo = (todo) =>
      todo.status === "completed" ? { ...todo, status: "archived" } : todo;

    const transitions = {
      complete: completeTodo,
      reopen: reopenTodo,
      archive: archiveTodo,
    };
    const labels = { complete: "Complete", reopen: "Reopen", archive: "Archive" };
    const actions = {
      open: ["complete"],
      completed: ["reopen", "archive"],
      archived: ["reopen"],
    };

    const render = () => {
      document.querySelector("#summary").textContent = `${todos.length} ${
        todos.length === 1 ? "task" : "tasks"
      } in total`;

      for (const status of statuses) {
        const group = todos.filter((todo) => todo.status === status);
        const list = document.querySelector(`#${status}-tasks`);
        const count = document.querySelector(`#${status}-count`);
        list.replaceChildren();
        count.textContent = String(group.length);
        count.setAttribute("aria-label", `${group.length} ${status}`);

        if (group.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = `No ${status} tasks`;
          list.append(empty);
          continue;
        }

        for (const todo of group) {
          const item = document.createElement("li");
          item.className = "task";
          item.dataset.todoId = todo.id;

          const text = document.createElement("p");
          text.className = "task-text";
          text.textContent = todo.text;
          item.append(text);

          const metadata = [
            todo.dueDate && `Due ${todo.dueDate}`,
            todo.priority !== undefined && `Priority ${todo.priority}`,
            ...(todo.tags ?? []).map((tag) => `#${tag}`),
          ].filter(Boolean);
          if (metadata.length > 0) {
            const meta = document.createElement("ul");
            meta.className = "task-meta";
            for (const value of metadata) {
              const detail = document.createElement("li");
              detail.textContent = value;
              meta.append(detail);
            }
            item.append(meta);
          }

          const controls = document.createElement("div");
          controls.className = "task-actions";
          for (const action of actions[status]) {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.action = action;
            button.textContent = labels[action];
            controls.append(button);
          }
          item.append(controls);
          list.append(item);
        }
      }
    };

    document.querySelector("#composer").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.querySelector("#task-text");
      const dueDate = document.querySelector("#due-date");
      const priority = document.querySelector("#priority");
      const tags = document.querySelector("#tags");
      const todo = createTodo({
        text: input.value,
        dueDate: dueDate.value,
        priority: priority.value,
        tags: tags.value.split(",").map((tag) => tag.trim()).filter(Boolean),
      });
      const error = document.querySelector("#error");
      if (todo === null) {
        error.textContent = "Enter a task before adding it.";
        return;
      }
      error.textContent = "";
      todos = [...todos, todo];
      event.currentTarget.reset();
      input.focus();
      render();
    });

    document.querySelector(".board").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      const item = button?.closest("[data-todo-id]");
      const transition = button && transitions[button.dataset.action];
      if (!item || !transition) return;
      todos = todos.map((todo) =>
        todo.id === item.dataset.todoId ? transition(todo) : todo
      );
      render();
    });

    render();
    </script>
  </body>
</html>
